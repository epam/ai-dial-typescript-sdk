                  resources:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        permissions:
                          description: |
                            Lists the permissions you have on the resource if `with` is set to "me".
                            Lists the permissions you have granted to others if `with` is set to "others".
                          type: array
                          items:
                            type: string
                            enum:
                              - READ
                              - WRITE
                  receivers:
                    type: array
                    items:
                      type: object
                      properties:
                        receiver:
                          type: string
                        resources:
                          type: array
                          items:
                            type: object
                            properties:
                              url:
                                type: string
                              permissions:
                                type: array
                                items:
                                  type: string
                                  enum:
                                    - READ
                                    - WRITE
              examples:
                me:
                  value:
                    resources:
                      - url: prompts/3CcedGxCx23EwiVbVmyf46KypuBQ65miviST/folder1/folder2/prompt_name
                        permissions:
                          - READ
                others:
                  value:
                    receivers:
                      - receiver: '112345678'
                        resources:
                          - url: prompts/3CcedGxCx23EwiVbVmyf46KypuBQ65miviST/folder1/folder2/prompt_name
                            permissions:
                              - READ
        '403':
          description: Unauthorized - Operation is only permitted by per request API key
      x-codeSamples:
        - lang: cURL
          label: CURL
          source: |
            curl -X POST https://chat.<company>.com/v1/ops/resource/per-request-permissions/list \
              -H "Api-Key: DIAL_API_KEY" \
              -d '{
                "with": "me",
              }'
