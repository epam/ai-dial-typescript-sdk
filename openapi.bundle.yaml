        type:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        param:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        display_message:
          type: string
          nullable: true
          description: |
            The user-friendly error message for non-technical users.
    userinfo:
      type: object
      description: User info
      properties:
        project:
          type: string
          description: The project name.
        roles:
          type: array
          description: List of user or API key roles.
          items:
            type: string
        userClaims:
          type: object
          description: Claims extracted from the access token.
          properties:
            email:
              type: array
              description: The email of the user.
              items:
                type: string
            sub:
              type: array
              description: Identifies the principal or subject of the token.
              items:
                type: string
    ApplicationLogs:
      type: object
      description: Application logs
      properties:
        logs:
          type: array
          description: log records
          items:
            $ref: '#/components/schemas/ApplicationLog'
    ApplicationLog:
      type: object
      properties:
        instance:
          description: machine instance ID
          type: string
        content:
          description: log content
          type: string
    CodeInterpreterRequestFile:
      type: object
      properties:
        sessionId:
          type: string
          description: session ID
        sourceUrl:
          type: string
          description: URL to source file
        targetPath:
          type: string
          description: Path to target file
    CodeInterpreterFile:
      type: object
      properties:
        sessionId:
          type: string
          description: session ID
        path:
          type: string
          description: path to file
        size:
          type: integer
          description: file size
    GetSession:
      type: object
      properties:
        sessionId:
          type: string
          description: Session ID
    PromptRequest:
      type: object
      properties:
        id:
          type: string
          description: Prompt unique identifier
        name:
          type: string
          description: Display name
        folderId:
          type: string
          description: Path to the folder where prompt located according to the user's root
        content:
          type: string
          description: Prompt body
      required:
        - id
        - name
        - folderId
        - content
    JsonRpcRequest:
      type: object
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          enum:
            - '2.0'
          description: JSON-RPC protocol version
        method:
          type: string
          description: Name of the method to be invoked.
        params:
          description: |
            Parameter values for the RPC call. Can be: `array` (by-position parameters) OR `object` (by-name parameters).
          oneOf:
            - type: array
              items: {}
            - type: object
        id:
          description: |
            Identifier established by the client. Must be included in the
            response if present. If omitted, it's a notification.
          oneOf:
            - type: string
            - type: integer
    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
      properties:
        jsonrpc:
          type: string
          enum:
            - '2.0'
          description: JSON-RPC protocol version
        result:
          description: |
            The successful result of the RPC call. Must not be included
            if `error` is present.
        error:
          description: |
            Error object in case of failure. Must not be included
            if `result` is present.
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: integer
              description: Error code.
            message:
              type: string
              description: Error message.
            data:
              description: Additional error information
        id:
          description: |
            Same `id` as in the request. `Null` for certain errors where the
            request `id` cannot be determined.
          oneOf:
            - type: string
            - type: integer
    Deployments:
      type: object
      properties:
        deployments:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/ModelOpenAi'
              - $ref: '#/components/schemas/ApplicationOpenAi'
              - $ref: '#/components/schemas/ToolsetOpenAi'
